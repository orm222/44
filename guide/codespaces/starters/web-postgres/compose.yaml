services:
  web:
    build: ./web
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build: ./api
    init: true
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: app_local
      DB_USER: app_local
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    # Keep major version and PGDATA together when upgrading an existing volume.
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: app_local
      POSTGRES_USER: app_local
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/project-data
    secrets: [db_password]
    networks: [data]
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
networks:
  edge: {}
  data:
    internal: true
volumes:
  db_data: {}
secrets:
  db_password:
    file: ./.secrets/db_password.txt
